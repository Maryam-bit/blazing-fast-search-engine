stages:
  - test

test_backend:
  stage: test
  image: node:latest
  services:
    - name: mysql:8.0.33
      alias: mysqldb
    - name: influxdb:2.0
      alias: influxdb
  variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: database_test
    DOCKER_INFLUXDB_INIT_MODE: setup
    DOCKER_INFLUXDB_INIT_USERNAME: admin
    DOCKER_INFLUXDB_INIT_PASSWORD: root@admin
    DOCKER_INFLUXDB_INIT_ORG: Cowlar
    DOCKER_INFLUXDB_INIT_BUCKET: weather_data
    DOCKER_INFLUXDB_INIT_RETENTION: 1w
    DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: 1lhcUUm4pjfdfdtyghgdhghgf-7qTxR0GT38dDIdskKxG6cprYcvsuClzqPbl_BWoN_I-DOtB3LpAl7D2czj367w==
    NODE_ENV: development
    SECRET: secret
    INFLUXDB_HOST: influxdb
  script:
    - npm install
    - npm run test
